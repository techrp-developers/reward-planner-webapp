<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-serv" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="doc-grad" x1="60" y1="75" x2="140" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="105" y1="110" x2="145" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="serv-shadow" x="35" y="152" width="130" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="serv-glow" x="40" y="60" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg-serv)"/>
  <circle cx="100" cy="118" r="52" fill="#7DD3FC" opacity="0.3"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="166" rx="46" ry="9" fill="#0369A1" opacity="0.2" filter="url(#serv-shadow)"/>

  <!-- Main Graphic: Clean Document & Protection Shield -->
  <g filter="url(#serv-glow)">
    <!-- Document Card -->
    <rect x="62" y="74" width="76" height="88" rx="10" fill="url(#doc-grad)" stroke="#BAE6FD" stroke-width="2"/>
    
    <!-- Checklist items inside document -->
    <rect x="74" y="88" width="30" height="6" rx="3" fill="#0284C7" opacity="0.8"/>
    <rect x="74" y="100" width="46" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="74" y="110" width="38" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="74" y="120" width="42" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="74" y="130" width="28" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>

    <!-- Verification / Security Shield Badge at bottom right -->
    <path d="M110 115 L132 110 L132 132 C132 144 122 152 110 156 C98 152 88 144 88 132 L88 110 Z" fill="url(#shield-grad)" transform="translate(14, -2) scale(0.9)"/>
    <!-- White Checkmark on Shield -->
    <path d="M106 122 L111 127 L119 118" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
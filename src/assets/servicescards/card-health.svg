<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-health" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="60" y1="75" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cross-badge" x1="105" y1="115" x2="145" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="health-shadow" x="35" y="152" width="130" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="health-glow" x="40" y="65" width="120" height="115" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg-health)"/>
  <circle cx="100" cy="118" r="52" fill="#86EFAC" opacity="0.35"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="166" rx="46" ry="9" fill="#059669" opacity="0.2" filter="url(#health-shadow)"/>

  <!-- Main Graphic: Clean Heart with Pulse Line + Green Medical Cross -->
  <g filter="url(#health-glow)">
    <!-- Heart Shape -->
    <path d="M100 156 C70 135 55 115 55 96 C55 82 66 72 80 72 C89 72 96 77 100 84 C104 77 111 72 120 72 C134 72 145 82 145 96 C145 115 130 135 100 156 Z" fill="url(#heart-grad)"/>

    <!-- Pulse ECG Line across Heart -->
    <path d="M68 100 L84 100 L90 88 L98 114 L106 94 L112 102 L116 100 L132 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Medical Shield / Circle at Bottom Right -->
    <circle cx="130" cy="134" r="16" fill="url(#cross-badge)"/>
    <!-- Medical Plus Cross -->
    <rect x="127" y="125" width="6" height="18" rx="2" fill="#FFFFFF"/>
    <rect x="121" y="131" width="18" height="6" rx="2" fill="#FFFFFF"/>
  </g>
</svg>
<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-game" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="pad-body" x1="50" y1="80" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="game-shadow" x="35" y="152" width="130" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="game-glow" x="40" y="65" width="120" height="115" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#DB2777" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg-game)"/>
  <circle cx="100" cy="118" r="52" fill="#F472B6" opacity="0.3"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="166" rx="46" ry="9" fill="#BE185D" opacity="0.2" filter="url(#game-shadow)"/>

  <!-- Main Graphic: Sleek White/Accent Game Controller -->
  <g filter="url(#game-glow)">
    <!-- Controller Body -->
    <path d="M72 88 C82 86 92 90 100 90 C108 90 118 86 128 88 C144 91 152 108 148 136 C146 148 136 156 124 150 L110 134 C104 132 96 132 90 134 L76 150 C64 156 54 148 52 136 C48 108 56 91 72 88 Z" fill="url(#pad-body)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Directional Pad (D-Pad) Left -->
    <rect x="72" y="104" width="6" height="18" rx="2" fill="#475569"/>
    <rect x="66" y="110" width="18" height="6" rx="2" fill="#475569"/>

    <!-- Action Buttons Right (Clean 4 colored dots) -->
    <circle cx="126" cy="106" r="3.5" fill="#EF4444"/> <!-- Red -->
    <circle cx="133" cy="113" r="3.5" fill="#3B82F6"/> <!-- Blue -->
    <circle cx="126" cy="120" r="3.5" fill="#10B981"/> <!-- Green -->
    <circle cx="119" cy="113" r="3.5" fill="#F59E0B"/> <!-- Yellow -->

    <!-- Twin Analog Sticks -->
    <circle cx="88" cy="126" r="7" fill="#64748B"/>
    <circle cx="112" cy="126" r="7" fill="#64748B"/>
    <circle cx="88" cy="126" r="4" fill="#334155"/>
    <circle cx="112" cy="126" r="4" fill="#334155"/>
  </g>
</svg>
<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-bus" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="50%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="bus-body" x1="60" y1="80" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="70" y1="85" x2="130" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="bus-shadow" x="35" y="152" width="130" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bus-glow" x="40" y="65" width="120" height="115" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0891B2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg-bus)"/>
  <circle cx="100" cy="118" r="52" fill="#67E8F9" opacity="0.32"/>

  <!-- Shadow -->
  <ellipse cx="100" cy="166" rx="48" ry="9" fill="#0891B2" opacity="0.22" filter="url(#bus-shadow)"/>

  <!-- Main Graphic: Clean Modern Bus -->
  <g filter="url(#bus-glow)">
    <!-- Bus Cabin Base -->
    <rect x="62" y="80" width="76" height="74" rx="14" fill="url(#bus-body)"/>
    
    <!-- Top Destination Display -->
    <rect x="76" y="84" width="48" height="6" rx="3" fill="#0F172A"/>

    <!-- Large Windshield Window -->
    <rect x="68" y="94" width="64" height="30" rx="6" fill="url(#glass-grad)"/>
    <!-- Wiper divider -->
    <line x1="100" y1="94" x2="100" y2="124" stroke="#0284C7" stroke-width="2" opacity="0.6"/>

    <!-- Front Grille / Bumper -->
    <rect x="74" y="132" width="52" height="10" rx="4" fill="#0F172A" opacity="0.6"/>
    
    <!-- Headlights -->
    <circle cx="72" cy="136" r="5" fill="#FEF08A"/>
    <circle cx="128" cy="136" r="5" fill="#FEF08A"/>

    <!-- Wheels -->
    <rect x="68" y="152" width="12" height="6" rx="3" fill="#1E293B"/>
    <rect x="120" y="152" width="12" height="6" rx="3" fill="#1E293B"/>
  </g>
</svg>